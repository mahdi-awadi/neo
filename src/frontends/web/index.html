/* Reduced motion (AC9): no entry slide/fade, no pulse, no drawer slide, instant scrolling. */
/* "Running now" (ADR-0058): each running tool call with Stop / Background — only that command. */
.runstrip{display:flex;flex-direction:column;gap:6px;padding:8px 14px;border-block-end:1px solid var(--border);background:var(--panel)}
.runstrip h4{margin:0;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.runrow{display:flex;align-items:center;gap:8px;min-width:0}
.runrow .rc{flex:1;min-width:0;font-family:var(--code);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;unicode-bidi:isolate;text-align:start}
.runrow .rp{font-size:11px;color:var(--muted);white-space:nowrap}
/* The Core splash (ADR-0056 amendment): the wordmark draws in, the engine core pops, then it fades once

.splash.out{opacity:0;pointer-events:none}

.splash .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:splash-draw calc(var(--splash-ms)*.5) cubic-bezier(.4,0,.2,1) forwards}
.splash .d2{animation-delay:calc(var(--splash-ms)*.12)}.splash .d3{animation-delay:calc(var(--splash-ms)*.24)}
.splash .core{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:splash-core calc(var(--splash-ms)*.36) calc(var(--splash-ms)*.64) cubic-bezier(.2,.8,.3,1.4) forwards}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (prefers-reduced-motion:reduce){.splash .draw{stroke-dashoffset:0}.splash .core{transform:none}}

.sheet .sh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel)}.sheet .sh #tdclose{margin-inline-start:auto}
.sheet .sb{padding:14px 16px 18px;overflow-y:auto}
.sheet h2{font-size:16px;margin:0 0 10px;line-height:1.4}
.sheet dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0 0 12px;font-size:13px}.sheet dt{color:var(--muted)}.sheet dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sheet pre{white-space:pre-wrap;font-family:var(--sans);font-size:13px;margin:6px 0 0;overflow-wrap:anywhere}
@media (max-width:640px){.sheet{width:100vw;max-width:100vw;margin:auto 0 var(--kb,0px);border-radius:16px 16px 0 0;max-height:min(88vh,var(--app-h,100dvh))}}
.sheet .ipicks fieldset{border:1px solid var(--border);border-radius:10px;margin:0 0 10px;padding:8px 12px}.sheet .ipicks legend{padding:0 4px}.sheet .ipicks label{display:flex;gap:8px;align-items:center;min-height:44px}
.sheet .itemb h2{overflow-wrap:anywhere}.sheet .acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.sheet .acts.stick{position:sticky;bottom:0;background:var(--panel);padding-block:10px;margin:0;border-top:1px solid var(--border)}
.sheet .ireply{display:flex;flex-direction:column;gap:8px;margin-top:6px}.sheet .ireply textarea{width:100%;min-height:88px;font-size:16px;resize:vertical}
.sheet .plandoc{margin:10px 0;padding:0}.sheet .plandoc .tx{overflow-wrap:anywhere}.sheet .plandoc pre,.sheet .plandoc table{max-width:100%;overflow-x:auto;display:block}
details.hk>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--muted);font-size:12px}
/* History (ADR-0067): the search, the filters (folded behind one button on a phone), the mode banner, hit cards. */
#vhistory{gap:12px}
.hsearch{display:flex;gap:8px;align-items:center;min-width:0}
.hsearch input,.hfil input,.hrem textarea,.hrem input,#hfreason{background:var(--ink);border:1px solid var(--border);color:var(--fg);border-radius:9px;padding:8px 11px;font-family:var(--sans);font-size:13px;outline:none;min-width:0}
.hsearch input{flex:1}
.hsearch input:focus,.hfil input:focus,.hrem textarea:focus,.hrem input:focus,#hfreason:focus{border-color:var(--accent-dim);box-shadow:0 0 0 3px var(--glow)}
.hfbtn{display:none}
.hfil{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:end}
.hfil label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);min-width:0}
.hkinds{grid-column:1/-2;display:flex;flex-wrap:wrap;gap:6px}
.hkc[aria-pressed=true]{border-color:var(--accent-dim);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.hres{display:flex;flex-direction:column;gap:10px;min-width:0}
.hstate{color:var(--faint);font-size:13px;padding:18px 4px;text-align:center}.herr{color:var(--danger)}
.hbanner{border:1px solid color-mix(in srgb,var(--warn) 45%,var(--border));background:color-mix(in srgb,var(--warn) 7%,var(--panel));border-radius:11px;padding:9px 13px;font-size:13px}
.hb-skipped{border-color:var(--border);background:var(--panel)}
.hcount{font-size:11px;color:var(--muted)}
.hcard{border:1px solid var(--border);border-radius:13px;background:var(--panel);padding:11px 14px;min-width:0;overflow-wrap:anywhere}
.hm{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.ht{margin:6px 0 4px;font-size:14px;font-weight:600;line-height:1.4}
.hsn{font-size:13px;line-height:1.55;color:var(--out-fg)}.hsn mark{background:color-mix(in srgb,var(--accent) 25%,transparent);color:inherit}
.hx{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:7px;font-size:11.5px;color:var(--muted)}
.hvias{display:flex;gap:4px}.hvia{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:999px;background:var(--panel2)}
.harc{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--border))}
.hrem summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--muted);font-size:12px}
.hrem textarea{width:100%;resize:vertical}.hrem .acts input{flex:1}
#hfsheet h2{margin:0;font-size:15px}.hfentry{font-size:13px}.hflabel{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}#hfreason{width:100%;resize:vertical}
:lang(ar) .hvia{letter-spacing:normal}
@media (max-width:768px){
.hfbtn{display:inline-flex}
.hfil{display:none;grid-template-columns:minmax(0,1fr)}
.hfil.open{display:grid}
.hkinds{grid-column:1/-1}
.hsearch input,.hfil input,.hrem textarea,.hrem input,#hfreason{font-size:16px}
}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:3px solid var(--ink)}
</style></head>
<body><div class="splash" id="splash" aria-hidden="true"><svg class="logo" viewBox="2 8 100 42" focusable="false"><g fill="none" stroke="currentColor" stroke-width="7">
        <path class="draw" pathLength="1" d="M10 42V29A11 11 0 0 1 32 29V42"/>
        <path class="draw d2" pathLength="1" d="M41 29H63A11 11 0 1 0 59.8 36.8"/>
        <circle class="draw d3" pathLength="1" cx="83" cy="29" r="11"/>
      </g>
      <circle class="core" cx="83" cy="29" r="3.6" style="fill:var(--accent)"/></svg></div>
<script>var neoSplash=document.getElementById("splash");setTimeout(function(){if(neoSplash)neoSplash.remove()},(parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--splash-ms"))||1200)*6)</script>
<div class="app">
 <aside id="side">
  <div class="brand"><div class="wm"><svg class="logo" viewBox="2 8 100 42" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="7">
        <path d="M10 42V29A11 11 0 0 1 32 29V42"/>
        <path d="M41 29H63A11 11 0 1 0 59.8 36.8"/>
        <circle cx="83" cy="29" r="11"/>
      </g>
      <circle cx="83" cy="29" r="3.6" style="fill:var(--accent)"/></svg><span class="vh">neo</span></div><div class="ver" id="ver" dir="ltr" hidden></div><div class="sub" data-i18n="brand.sub"></div></div>
  <div class="sec" data-i18n="newProject.section"></div>
  <div class="np">
   <select id="repo"></select>
   <textarea id="task" rows="1" dir="auto" data-compose="send" data-i18n-placeholder="newProject.taskPlaceholder" data-i18n-title="feed.composeHint"></textarea>
   <button class="btn" id="open-project" data-compose-submit data-i18n="newProject.open"></button>
  </div>
  <div class="sec"><span data-i18n="sdk.section"></span><span id="sdk-label"></span></div>
  <div class="sdkbox" id="sdkbox"></div>
  <div class="sec"><span data-i18n="projects.section"></span><span id="pcount"></span></div>
  <div id="projects"><div class="empty" data-i18n="projects.empty"></div></div>
  <div class="foot"><span id="ftl">—</span><span id="sdk-foot"></span></div>
 </aside>
 <button class="scrim" type="button" id="scrim" tabindex="-1" data-i18n-aria="nav.close"></button>
 <main>
  <div class="top">
   <button class="chip" type="button" id="menu" aria-controls="side" aria-expanded="false" data-i18n-aria="nav.menu" data-i18n-title="nav.menu"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
   <nav class="tabs" id="tabs" data-i18n-aria="nav.views">
   <button class="tab on" data-v="activity" data-i18n="tabs.activity"></button>
   <button class="tab" data-v="threads" data-i18n="tabs.threads"></button>
   <button class="tab" data-v="projects" data-i18n="tabs.projects"></button>
   <button class="tab" data-v="history" data-i18n="tabs.history"></button>
   <button class="tab" data-v="todos"><span data-i18n="tabs.queue"></span><span id="tbadge" class="ibadge"></span></button>
   <button class="tab" data-v="loops" data-i18n="tabs.loops"></button>
   <button class="tab" data-v="usage" data-i18n="tabs.usage"></button>
   <button class="tab" data-v="recent" data-i18n="tabs.recent"></button>
   <button class="tab" data-v="inbox"><span data-i18n="tabs.inbox"></span><span id="ibadge" class="ibadge"></span></button>
   </nav>
   <span class="spacer"></span><span class="who" id="who"></span><span id="deploy" class="tchip own-sweep" hidden></span>
   <button class="chip" id="install" hidden data-i18n="pwa.install" data-i18n-title="pwa.installTitle"></button>
   <button class="chip" id="lang" data-i18n="brand.langSwitch" data-i18n-title="brand.langSwitchTitle"></button>
  </div>
  <section class="pins" id="pins" hidden aria-labelledby="pinh"></section>
  <div class="hint" id="ioshint" hidden role="status"><span data-i18n="pwa.iosHint"></span><button class="chip" type="button" id="ioshint-x" data-i18n="pwa.dismiss"></button></div>
  <div class="view on" id="vactivity">
   <div id="runstrip" class="runstrip" hidden></div>
   <div id="fbar"></div>
   <div id="feed"><div class="fe" id="ph" data-i18n="feed.placeholder"></div></div>
   <form class="compose" id="ff"><p class="anote" id="ffnote" role="alert" hidden></p><div class="atts" id="ffatts" data-i18n-aria="feed.attList" role="list" hidden></div><textarea id="msg" rows="1" dir="auto" data-compose="send" autocomplete="off" data-i18n-placeholder="feed.compose" data-i18n-title="feed.composeHint"></textarea><input type="file" id="file" hidden multiple><button class="chip" type="button" id="attach" data-i18n-title="feed.attach">📎</button><button type="submit" data-i18n="feed.send"></button></form>
  </div>
  <div class="view" id="vthreads">
   <div class="trail" id="trail"><div class="sec" data-i18n="threads.projects"></div><div id="tprojects"></div></div>
   <div class="tlist">
    <div class="tfilters">
     <input id="tq" type="search" autocomplete="off" data-i18n-placeholder="threads.search">
     <select id="tstate"></select><select id="torigin"></select><select id="tsince"></select>
    </div>
    <div id="thits"></div>
    <div id="trows"></div>
   </div>
   <div class="tpane">
    <button class="back" type="button" data-act="back"><span class="arr" aria-hidden="true">‹</span><span data-i18n="nav.back"></span></button>
    <div id="tbody"><div class="fe" data-i18n="threads.pick"></div></div>
    <form class="compose" id="tform" hidden><p class="anote" id="tformnote" role="alert" hidden></p><div class="atts" id="tformatts" data-i18n-aria="feed.attList" role="list" hidden></div><textarea id="tmsg" rows="1" dir="auto" data-compose="send" autocomplete="off" data-i18n-placeholder="threads.reply" data-i18n-title="feed.composeHint"></textarea><input type="file" id="tfile" hidden multiple><button class="chip" type="button" id="tattach" data-i18n-title="feed.attach">📎</button><button type="submit" data-i18n="feed.send"></button></form>
   </div>
  </div>
  <div class="view" id="vprojects">
   <div class="tlist"><div id="pjrows"></div></div>
   <div class="tpane"><button class="back" type="button" data-act="back"><span class="arr" aria-hidden="true">‹</span><span data-i18n="nav.back"></span></button><div id="pjbody"><div class="fe" data-i18n="pj.pick"></div></div></div>
  </div>
  <div class="view" id="vhistory">
   <form class="hsearch" id="hform" role="search">
    <input id="hq" type="search" maxlength="500" dir="auto" autocomplete="off" enterkeyhint="search" data-i18n-placeholder="history.placeholder" data-i18n-aria="history.placeholder">
    <button class="chip ok" type="submit" data-i18n="history.search"></button>
    <button class="chip hfbtn" type="button" id="hfbtn" aria-expanded="false" aria-controls="hfil" data-i18n="history.filters"></button>
   </form>
   <div class="hfil" id="hfil">
    <label><span data-i18n="history.project"></span><input id="hproj" type="text" maxlength="128" dir="auto" autocomplete="off" data-i18n-placeholder="history.projectAny"></label>
    <label><span data-i18n="history.since"></span><input id="hsince" type="date" dir="ltr"></label>
    <label><span data-i18n="history.until"></span><input id="huntil" type="date" dir="ltr"></label>
    <div class="hkinds" id="hkinds" role="group" data-i18n-aria="history.kinds"></div>
    <button class="chip" type="button" id="hfclear" data-i18n="history.clear"></button>
   </div>
   <div class="hres" id="hres" aria-live="polite"><div class="hstate" data-i18n="history.idle"></div></div>
   <details class="hrem">
    <summary data-i18n="history.remember.title"></summary>
    <textarea id="hrtext" rows="3" dir="auto" maxlength="4000" data-i18n-placeholder="history.remember.text" data-i18n-aria="history.remember.title"></textarea>
    <div class="acts"><input id="hrproj" type="text" maxlength="128" dir="auto" autocomplete="off" data-i18n-placeholder="history.remember.project" data-i18n-aria="history.remember.project"><button class="chip ok" type="button" id="hrsave" data-i18n="history.remember.save"></button></div>
   </details>
  </div>
  <div class="view" id="vtodos"></div>
  <div class="view" id="vloops"></div>
  <div class="view" id="vusage"></div>
  <div class="view" id="vrecent"></div>
  <div class="view" id="vinbox"></div>
 </main>
</div>
<dialog class="sheet" id="tdsheet" aria-labelledby="tdtitle"><div class="sh"><span id="tdhead"></span><button class="chip" type="button" id="tdclose" data-i18n="todoDetail.close"></button></div><div class="sb" id="tdbody"></div></dialog>
<dialog class="sheet" id="hfsheet" aria-labelledby="hftitle"><div class="sh"><h2 id="hftitle" data-i18n="history.forgetTitle"></h2></div><div class="sb">
 <p id="hfentry" class="hfentry"></p><p data-i18n="history.forgetBody"></p>
 <label class="hflabel" for="hfreason" data-i18n="history.forgetReason"></label><textarea id="hfreason" rows="2" dir="auto" maxlength="500" data-i18n-placeholder="history.forgetReasonPlaceholder"></textarea>
 <div class="acts"><button class="chip" type="button" id="hfcancel" data-i18n="history.cancel"></button><button class="chip no" type="button" id="hfgo" data-i18n="history.forgetConfirm"></button></div>
</div></dialog>
<div class="toasts" id="toasts" role="status" aria-live="polite" popover="manual"></div>
<script type="module" src="%APP_JS%"></script>
</body></html>
