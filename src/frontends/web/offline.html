<!doctype html><html lang="%LANG%" dir="%DIR%"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>%TITLE%</title>
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="%THEME_DARK%">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="%THEME_LIGHT%">
<style>
 :root{--ink:#080b10;--fg:#d7e2ee;--muted:#67788c;--accent:#3fe0a2;--glow:rgba(63,224,162,.25);--border:#1a2530}
 *{box-sizing:border-box}html,body{height:100%}
 body{margin:0;padding:24px;background:var(--ink);color:var(--fg);font-family:'Manrope','IBM Plex Sans Arabic',system-ui,sans-serif;display:grid;place-items:center;overflow:hidden;
  background-image:radial-gradient(720px 470px at 50% -12%,rgba(63,224,162,.10),transparent 60%)}
 .card{text-align:center;max-width:420px}
 .wm{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:34px;letter-spacing:.34em;margin:0 0 18px;display:inline-flex;align-items:center;gap:13px}
 .pulse{width:10px;height:10px;border-radius:50%;background:var(--muted)}
 h2{font-size:17px;font-weight:600;margin:0 0 8px}
 p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 22px}
 button{min-height:44px;padding:0 22px;border-radius:10px;border:0;background:var(--accent);color:#06241a;font-weight:700;font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.06em;cursor:pointer}
 button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--glow)}
 :lang(ar) button{letter-spacing:normal;font-family:inherit;font-size:14px}
</style></head>
<body><div class="card">
 <h1 class="wm" dir="ltr"><span class="pulse"></span>NEO</h1>
 <h2>%TITLE%</h2>
 <p>%BODY%</p>
 <button type="button" onclick="location.reload()">%RETRY%</button>
</div></body></html>
