<!doctype html><html lang="%LANG%" dir="%DIR%"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>%TITLE%</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="%THEME_DARK%">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="%THEME_LIGHT%">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
 :root{--ink:#080b10;--logo-accent:#f2552c;--fg:#d7e2ee;--muted:#67788c;--accent:#3fe0a2;--glow:rgba(63,224,162,.25);--border:#1a2530}
 *{box-sizing:border-box}html,body{height:100%}
 body{margin:0;background:var(--ink);color:var(--fg);font-family:'Manrope','IBM Plex Sans Arabic',system-ui,sans-serif;display:grid;place-items:center;overflow:hidden;
  background-image:radial-gradient(720px 470px at 50% -12%,rgba(63,224,162,.10),transparent 60%)}
 body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:46px 46px;mask-image:radial-gradient(circle at 50% 42%,rgba(0,0,0,.2),transparent 70%)}
 .card{text-align:center;position:relative;z-index:1;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
 .wm{margin:0 0 10px;display:inline-block;line-height:0}
 .logo{display:block;height:52px;width:auto;color:var(--fg);--accent:var(--logo-accent);overflow:visible}
 .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
 .pulse{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--glow);animation:pulse 2.4s infinite}
 .sub{font-family:'JetBrains Mono','IBM Plex Sans Arabic',monospace;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin:0 0 28px}
 :lang(ar) .sub{letter-spacing:normal;font-size:13px}
 @keyframes pulse{0%{box-shadow:0 0 0 0 var(--glow)}70%{box-shadow:0 0 0 13px transparent}100%{box-shadow:0 0 0 0 transparent}}
 @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style></head>
<body><div class="card">
 <h1 class="wm" dir="ltr"><svg class="logo" viewBox="2 8 100 42" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="7">
        <path d="M10 42V29A11 11 0 0 1 32 29V42"/>
        <path d="M41 29H63A11 11 0 1 0 59.8 36.8"/>
        <circle cx="83" cy="29" r="11"/>
      </g>
      <circle cx="83" cy="29" r="3.6" style="fill:var(--accent)"/></svg><span class="vh">neo</span></h1>
 <p class="sub">%SUB%</p>
 <script async src="https://telegram.org/js/telegram-widget.js?22"
  data-telegram-login="%BOT%" data-size="large" data-userpic="false" data-auth-url="/auth/telegram" data-request-access="write" data-lang="%LANG%"></script>
</div></body></html>
